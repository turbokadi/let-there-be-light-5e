# GitHub Actions workflow for creating a new FoundryVTT module release.
#
# On each published GitHub release:
#   1. installs the build tooling (esbuild),
#   2. builds a minified module into dist/ (npm run release), with the version taken from the tag,
#   3. zips dist/ into module.zip and attaches module.zip + module.json to the release.
#
# Troubleshooting Checklist:
#   - Is the release tag "v<major>.<minor>.<patch>" or "<major>.<minor>.<patch>"?
#   - This workflow only runs when a release is published, not when it is updated.
#   - Has the module's entry on https://foundryvtt.com/admin been updated?
name: Create Module Files For GitHub Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Strips an optional leading "v" from the tag (v1.2.3 -> 1.2.3).
      - name: Extract Version From Tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Minified build of the whole module into dist/, with the release version in dist/module.json.
      - name: Build Release
        run: npm run release
        env:
          MODULE_VERSION: ${{ steps.get_version.outputs.version }}

      - name: Create Module Archive
        run: cd dist && zip --recurse-paths ../module.zip .

      - name: Update Release With Files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.unpublished }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './dist/module.json, ./module.zip'
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
